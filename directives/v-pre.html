<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>v-pre</title>

</head>
<body>
    <script src="https://cdn.jsdelivr.net/npm/vue@2.6.14/dist/vue.min.js"></script>

    <div id="directives">
        <h2 v-pre>{{ nome }}</h2>
        <p v-on:click="alert('hello')" v-pre>Lorem ipsum dolor sit amet consectetur adipisicing elit. Necessitatibus neque accusantium deserunt, provident, quas ad iure dicta hic temporibus pariatur incidunt dolore atque exercitationem architecto illo voluptatibus doloribus voluptatem? Ea!</p>
    </div>
    
    <script>
        let app = new Vue({
            el: '#directives',
            data: {
                nome: 'marcos hiroshi'
            },
        })
    </script>
    
</body>
</html>
