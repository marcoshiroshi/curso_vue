<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>v-on</title>

</head>
<body>
    <script src="https://cdn.jsdelivr.net/npm/vue@2.6.14/dist/vue.min.js"></script>

    <div id="directives">

        <p v-on:click="reverseMethod">{{ message }}</p>
        <p v-on:[eventname]="reverseMethod">{{ message }}</p>

        <input v-on:keyup="filterPersons" type="text" placeholder="escreva um nome">
        <ul>
            <li v-for="person in personsFiltered">{{ person }}</li>
        </ul>

    </div>
    
    <script>
        let app = new Vue({
            el: '#directives',
            data: {
                message: 'ola mundo',
                eventname: 'click',
                persons: ['joao kleber', 'silvio santos', 'roberto carlos', 'hebe camargo'],
                personsFiltered: []
            },
            methods: {
                reverseMethod(){
                    return this.message = this.message.split('').reverse().join('');
                },
                filterPersons(event){
                    this.personsFiltered = this.persons.filter(name => {
                        return name.toUpperCase().includes(event.target.value.toUpperCase())
                    })
                }
            },
            created(){
                this.personsFiltered = this.persons
            }
        })
    </script>
    
</body>
</html>
